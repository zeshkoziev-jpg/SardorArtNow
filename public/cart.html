<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savat - SARDOR ART</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="cart">
  <div id="bg-animation"></div>
  <header id="main-header"></header>
  
  <main id="main-content" class="container">
    <h2 data-i18n="cart"></h2>
    <div id="cart-list"></div>
    <div id="cart-summary" class="cart-summary hidden">
      <div class="total-row">
        <span data-i18n="cart_total"></span>
        <span id="cart-total-price" class="price"></span>
      </div>
      <button id="checkout-btn" class="btn btn-primary" data-i18n="checkout"></button>
    </div>
  </main>

  <footer id="main-footer"></footer>
  <script src="/app.js"></script>
   <link rel="stylesheet" href="./sardor-extra.css">
  <script src="./sardor-extra.js"></script>
</body>
</html>
